services:
  pocketbook-db:
    image: postgres:16-alpine
    container_name: pocketbook-db
    restart: unless-stopped
    env_file:
      - /opt/docker/pocketbook/stack.env
    environment:
      - POSTGRES_USER=pocketbook
      - POSTGRES_DB=pocketbook
      # POSTGRES_PASSWORD comes from env_file (stack.env must include it alongside PB_POSTGRES_PASSWORD)
      - PB_POSTGRES_PASSWORD  # Portainer override passthrough
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment for local dev to allow direct psql access from the host:
    # ports:
    #   - "5432:5432"
    networks:
      - core_net

  pocketbook-web:
    image: ghcr.io/traejiik/pocketbook-web:latest
    container_name: pocketbook-web
    restart: unless-stopped
    depends_on:
      pocketbook-db:
        condition: service_healthy
    env_file:
      - /opt/docker/pocketbook/stack.env
    environment:
      - PB_POSTGRES_USER=pocketbook
      - PB_POSTGRES_DB=pocketbook
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
      # Portainer panel overrides (passthrough — only applied if set in the panel)
      # entrypoint.sh maps PB_* → bare names at container startup
      - PB_AUTH_URL
      - PB_AUTH_SECRET
      - PB_POSTGRES_PASSWORD
      - PB_OLLAMA_BASE_URL
      - PB_FX_SYNC_SECRET
      - PB_USER_DISPLAY_NAME
      - PB_INSTANCE_NAME
      - PB_SEED_USER_EMAIL
      - PB_SEED_USER_PASSWORD
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/data:/data
    networks:
      - core_net

  fx-sync:
    image: alpine:3.20
    container_name: pocketbook-fx-sync
    restart: unless-stopped
    depends_on:
      - pocketbook-web
    env_file:
      - /opt/docker/pocketbook/stack.env
    environment:
      - PB_FX_SYNC_SECRET  # Portainer override passthrough
    command:
      - sh
      - -c
      - "{ echo \"0 3 * * * wget -qO- --header 'X-Sync-Secret: $$PB_FX_SYNC_SECRET' --post-data='' http://pocketbook-web:3000/api/fx/sync || true\"; echo \"5 3 1 * * wget -qO- --header 'X-Sync-Secret: $$PB_FX_SYNC_SECRET' --post-data='' http://pocketbook-web:3000/api/insights/monthly || true\"; } | crontab - && crond -f -l 8"
    networks:
      - core_net

networks:
  core_net:
    external: true
