services:
  pocketbook-db:
    image: postgres:16-alpine
    container_name: pocketbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocketbook
      POSTGRES_PASSWORD: ${PB_POSTGRES_PASSWORD:-pocketbook}
      POSTGRES_DB: pocketbook
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment for local dev to allow direct psql access from the host:
    # ports:
    #   - "5432:5432"
    networks:
      - core_net

  pocketbook-web:
    image: ghcr.io/traejiik/pocketbook-web:latest
    container_name: pocketbook-web
    restart: unless-stopped
    depends_on:
      pocketbook-db:
        condition: service_healthy
    environment:
      PB_POSTGRES_USER: pocketbook
      PB_POSTGRES_PASSWORD: ${PB_POSTGRES_PASSWORD:-pocketbook}
      PB_POSTGRES_DB: pocketbook
      NEXTAUTH_URL: ${PB_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${PB_NEXTAUTH_SECRET}
      OLLAMA_BASE_URL: ${PB_OLLAMA_BASE_URL:-http://ollama:11434}
      FX_SYNC_SECRET: ${PB_FX_SYNC_SECRET}
      PB_USER_DISPLAY_NAME: ${PB_USER_DISPLAY_NAME:-Pocketbook}
      PB_INSTANCE_NAME: ${PB_INSTANCE_NAME:-}
      SEED_USER_EMAIL: ${PB_SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${PB_SEED_USER_PASSWORD}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/data:/data
    networks:
      - core_net

  fx-sync:
    image: alpine:3.20
    container_name: pocketbook-fx-sync
    restart: unless-stopped
    depends_on:
      - pocketbook-web
    environment:
      FX_SYNC_SECRET: ${PB_FX_SYNC_SECRET}
    command: >
      sh -c "echo '0 3 * * * wget -qO- --header=\"X-Sync-Secret: $$FX_SYNC_SECRET\"
      --post-data=\"\" http://pocketbook-web:3000/api/fx/sync || true' | crontab - && crond -f -l 8"
    networks:
      - core_net

networks:
  core_net:
    external: true
