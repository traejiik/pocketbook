services:
  pocketbook-db:
    image: postgres:16-alpine
    container_name: pocketbook-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pocketbook
      - POSTGRES_DB=pocketbook
      - PB_POSTGRES_PASSWORD=${PB_POSTGRES_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - 'export POSTGRES_PASSWORD="$$PB_POSTGRES_PASSWORD"; exec docker-entrypoint.sh postgres'
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketbook -d pocketbook"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core_net

  pocketbook-web:
    image: ghcr.io/traejiik/pocketbook-web:latest
    container_name: pocketbook-web
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      pocketbook-db:
        condition: service_healthy
    environment:
      - PB_POSTGRES_USER=pocketbook
      - PB_POSTGRES_DB=pocketbook
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
      # ===================================
      - PB_AUTH_URL=${PB_AUTH_URL:-}
      - PB_AUTH_SECRET=${PB_AUTH_SECRET:-}
      - PB_POSTGRES_PASSWORD=${PB_POSTGRES_PASSWORD:-}
      - PB_OLLAMA_BASE_URL=${PB_OLLAMA_BASE_URL:-}
      - PB_USER_DISPLAY_NAME=${PB_USER_DISPLAY_NAME:-}
      - PB_INSTANCE_NAME=${PB_INSTANCE_NAME:-}
      - PB_SEED_USER_EMAIL=${PB_SEED_USER_EMAIL:-}
      - PB_SEED_USER_PASSWORD=${PB_SEED_USER_PASSWORD:-}
      # Logging (all optional). Level defaults to info; requests default to on.
      - PB_LOG_LEVEL=${PB_LOG_LEVEL:-}
      - PB_LOG_FORMAT=${PB_LOG_FORMAT:-}
      - PB_LOG_REQUESTS=${PB_LOG_REQUESTS:-}
    volumes:
      # Runtime configuration, job state, and startup diagnostics.
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/data:/data
      # Verified custom-format PostgreSQL archives; newest 14 are retained.
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/backups:/backups
      # Optional operator-maintained fallback (the app-managed cache is normally enough):
      # - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/stack.env:/run/pb-stack.env:ro
    networks:
      - core_net

networks:
  core_net:
    external: true
