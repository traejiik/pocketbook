services:
  pocketbook-db:
    image: postgres:16-alpine
    container_name: pocketbook-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pocketbook
      - POSTGRES_DB=pocketbook
      # The postgres image needs the bare POSTGRES_PASSWORD. We map it from
      # PB_POSTGRES_PASSWORD (set in the Portainer panel) at container startup so
      # stack/panel config only ever uses the PB_ prefix — no unprefixed
      # POSTGRES_PASSWORD to collide with other postgres services in a shared stack.
      - PB_POSTGRES_PASSWORD=${PB_POSTGRES_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - 'export POSTGRES_PASSWORD="$$PB_POSTGRES_PASSWORD"; exec docker-entrypoint.sh postgres'
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment for local dev to allow direct psql access from the host:
    # ports:
    #   - "5432:5432"
    networks:
      - core_net

  pocketbook-web:
    image: ghcr.io/traejiik/pocketbook-web:latest
    container_name: pocketbook-web
    restart: unless-stopped
    depends_on:
      pocketbook-db:
        condition: service_healthy
    environment:
      - PB_POSTGRES_USER=pocketbook
      - PB_POSTGRES_DB=pocketbook
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
      # Secrets come from the Portainer stack environment panel via ${} interpolation.
      # (Interpolation is the reliable path in Portainer; the bare `- VAR` passthrough
      # form is NOT guaranteed to reach the container.) entrypoint.sh then maps
      # PB_* → the bare names Auth.js and the app expect at container startup.
      - PB_AUTH_URL=${PB_AUTH_URL:-}
      - PB_AUTH_SECRET=${PB_AUTH_SECRET:-}
      - PB_POSTGRES_PASSWORD=${PB_POSTGRES_PASSWORD:-}
      - PB_OLLAMA_BASE_URL=${PB_OLLAMA_BASE_URL:-}
      - PB_FX_SYNC_SECRET=${PB_FX_SYNC_SECRET:-}
      - PB_USER_DISPLAY_NAME=${PB_USER_DISPLAY_NAME:-}
      - PB_INSTANCE_NAME=${PB_INSTANCE_NAME:-}
      - PB_SEED_USER_EMAIL=${PB_SEED_USER_EMAIL:-}
      - PB_SEED_USER_PASSWORD=${PB_SEED_USER_PASSWORD:-}
    volumes:
      - ${PB_DOCKER_DIR:-/opt/docker}/pocketbook/data:/data
    networks:
      - core_net

  fx-sync:
    image: alpine:3.20
    container_name: pocketbook-fx-sync
    restart: unless-stopped
    depends_on:
      - pocketbook-web
    environment:
      - PB_FX_SYNC_SECRET=${PB_FX_SYNC_SECRET:-}  # from the Portainer stack environment panel
    command:
      - sh
      - -c
      - "{ echo \"0 3 * * * wget -qO- --header 'X-Sync-Secret: $$PB_FX_SYNC_SECRET' --post-data='' http://pocketbook-web:3000/api/fx/sync || true\"; echo \"5 3 1 * * wget -qO- --header 'X-Sync-Secret: $$PB_FX_SYNC_SECRET' --post-data='' http://pocketbook-web:3000/api/insights/monthly || true\"; } | crontab - && crond -f -l 8"
    networks:
      - core_net

networks:
  core_net:
    external: true
