<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pocketbook — design system + prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Geist', 'ui-sans-serif', 'system-ui'],
          mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          // shadcn-style tokens mapped to CSS vars
          border: 'hsl(var(--border) / <alpha-value>)',
          input: 'hsl(var(--input) / <alpha-value>)',
          ring: 'hsl(var(--ring) / <alpha-value>)',
          background: 'hsl(var(--background) / <alpha-value>)',
          foreground: 'hsl(var(--foreground) / <alpha-value>)',
          primary: {
            DEFAULT: 'hsl(var(--primary) / <alpha-value>)',
            foreground: 'hsl(var(--primary-foreground) / <alpha-value>)',
          },
          secondary: {
            DEFAULT: 'hsl(var(--secondary) / <alpha-value>)',
            foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)',
          },
          muted: {
            DEFAULT: 'hsl(var(--muted) / <alpha-value>)',
            foreground: 'hsl(var(--muted-foreground) / <alpha-value>)',
          },
          accent: {
            DEFAULT: 'hsl(var(--accent) / <alpha-value>)',
            foreground: 'hsl(var(--accent-foreground) / <alpha-value>)',
          },
          card: {
            DEFAULT: 'hsl(var(--card) / <alpha-value>)',
            foreground: 'hsl(var(--card-foreground) / <alpha-value>)',
          },
          destructive: {
            DEFAULT: 'hsl(var(--destructive) / <alpha-value>)',
            foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)',
          },
          success: {
            DEFAULT: 'hsl(var(--success) / <alpha-value>)',
            foreground: 'hsl(var(--success-foreground) / <alpha-value>)',
          },
          income:   'hsl(var(--income) / <alpha-value>)',
          expense:  'hsl(var(--expense) / <alpha-value>)',
          savings:  'hsl(var(--savings) / <alpha-value>)',
          neutral2: 'hsl(var(--neutral) / <alpha-value>)',
        },
        borderRadius: {
          lg: 'var(--radius)',
          md: 'calc(var(--radius) - 2px)',
          sm: 'calc(var(--radius) - 4px)',
        },
        boxShadow: {
          'pb-1': 'var(--shadow-1)',
          'pb-2': 'var(--shadow-2)',
          'pb-3': 'var(--shadow-3)',
        },
      },
    },
  };
</script>
<style>
  :root {
    /* Light theme (proper swap; dark is default below) */
    --background: 30 14% 97%;
    --foreground: 240 8% 10%;
    --card: 0 0% 100%;
    --card-foreground: 240 8% 10%;
    --popover: 0 0% 100%;
    --popover-foreground: 240 8% 10%;
    --primary: 220 90% 56%;
    --primary-foreground: 0 0% 100%;
    --secondary: 240 5% 94%;
    --secondary-foreground: 240 8% 14%;
    --muted: 240 5% 94%;
    --muted-foreground: 240 4% 42%;
    --accent: 240 5% 92%;
    --accent-foreground: 240 8% 14%;
    --destructive: 6 78% 50%;
    --destructive-foreground: 0 0% 100%;
    --success: 145 55% 38%;
    --success-foreground: 0 0% 100%;
    --border: 240 6% 88%;
    --input: 240 6% 88%;
    --ring: 220 90% 56%;

    --income: 152 55% 38%;
    --expense: 14 80% 50%;
    --savings: 220 90% 56%;
    --neutral: 240 4% 42%;

    --radius: 0.625rem;
    --shadow-1: 0 1px 0 rgba(15, 18, 23, 0.04), 0 1px 2px rgba(15, 18, 23, 0.06);
    --shadow-2: 0 4px 14px rgba(15, 18, 23, 0.08);
    --shadow-3: 0 18px 50px rgba(15, 18, 23, 0.18);
  }

  .dark {
    --background: 230 10% 6%;
    --foreground: 0 0% 96%;
    --card: 232 9% 8.5%;
    --card-foreground: 0 0% 96%;
    --popover: 232 9% 9%;
    --popover-foreground: 0 0% 96%;
    --primary: 220 95% 66%;
    --primary-foreground: 230 30% 8%;
    --secondary: 232 8% 13%;
    --secondary-foreground: 0 0% 96%;
    --muted: 232 8% 13%;
    --muted-foreground: 232 6% 60%;
    --accent: 232 8% 14%;
    --accent-foreground: 0 0% 96%;
    --destructive: 6 80% 60%;
    --destructive-foreground: 0 0% 100%;
    --success: 152 60% 50%;
    --success-foreground: 0 0% 8%;
    --border: 232 8% 16%;
    --input: 232 8% 16%;
    --ring: 220 95% 66%;

    --income: 152 60% 52%;
    --expense: 14 85% 64%;
    --savings: 220 95% 66%;
    --neutral: 232 6% 60%;

    --shadow-1: 0 1px 0 rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.45);
    --shadow-2: 0 6px 16px rgba(0,0,0,0.45);
    --shadow-3: 0 22px 60px rgba(0,0,0,0.55);
  }

  html, body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .tabular { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'ss01' 1; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  /* hide tailwind play warnings */
  [data-prevent-tw-warn] { display: none; }

  /* Subtle hairline for cards in dark mode */
  .pb-card {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
  }
  .pb-card-hover:hover { border-color: hsl(var(--ring) / 0.5); }

  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0E0F12"/>
      <path d="M40 130a60 60 0 0 1 120 0" stroke="#5C8AFA" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M40 130a60 60 0 0 1 60-60" stroke="#5C8AFA" stroke-width="14" stroke-linecap="round" stroke-opacity="0.35" fill="none"/>
      <circle cx="100" cy="142" r="10" fill="#5C8AFA"/>
    </svg>
  </template>
  <div id="root" class="min-h-screen"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="screens/login.jsx"></script>
  <script type="text/babel" src="screens/dashboard.jsx"></script>
  <script type="text/babel" src="screens/transactions.jsx"></script>
  <script type="text/babel" src="screens/add-transaction.jsx"></script>
  <script type="text/babel" src="screens/recurring.jsx"></script>
  <script type="text/babel" src="screens/categories.jsx"></script>
  <script type="text/babel" src="screens/renewals.jsx"></script>
  <script type="text/babel" src="screens/insights.jsx"></script>
  <script type="text/babel" src="screens/settings.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" src="spec.jsx"></script>
  <script type="text/babel" src="main.jsx"></script>
</body>
</html>
